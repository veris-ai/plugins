interface:
  display_name: "Veris test"
  short_description: "Run tests against the vendor's twin through veris-proxy: one named test, or every test that reaches the vendor."
  default_prompt: "$test [test file or pattern]"
policy:
  allow_implicit_invocation: false
dependencies:
  tools:
    - type: "mcp"
      value: "veris"
      description: "Veris control plane - environments and sandboxes. Configure the server in ~/.codex/config.toml; the skills also reach it over REST with curl."
      transport: "streamable_http"
      url: "https://svc.api.veris.ai/mcp"
