interface:
  display_name: "Veris build"
  short_description: "Build a feature: measure the vendor's twin before designing, prove the change through veris-proxy."
  default_prompt: "$build <issue link or prompt>"
policy:
  allow_implicit_invocation: false
dependencies:
  tools:
    - type: "mcp"
      value: "veris"
      description: "Veris control plane - environments and sandboxes. Configure the server in ~/.codex/config.toml; the skill's scripts/veris.sh reaches it over REST as well."
      transport: "streamable_http"
      url: "https://svc.api.veris.ai/mcp"
