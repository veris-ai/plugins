name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix veris/.opencode-plugin
      - run: sh tests/ledger_repository.sh
      - run: sh tests/record_argv.sh
      - run: sh tests/skill_version_claims.sh
      - run: SKILL_DOCS=bench/skills sh tests/skill_version_claims.sh
      - run: sh tests/opencode_plugin.sh
  bench-tracing:
    # The bench skill's tracing modules send only bench turns' model calls, with only the
    # bench key. Each case runs the module unchanged against a local listener.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python -m pip install opentelemetry-sdk opentelemetry-exporter-otlp-proto-common
      - run: python tests/bench_tracing/test_bench_tracing.py
      - run: npm ci --prefix tests/bench_tracing/node
      - run: node tests/bench_tracing/node/test_bench_tracing.mjs
