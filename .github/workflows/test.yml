name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix veris/.opencode-plugin
      - run: sh tests/ledger_repository.sh
      - run: sh tests/record_argv.sh
      - run: sh tests/opencode_plugin.sh
