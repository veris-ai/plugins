name: Skill helpers
on:
  pull_request:
    paths:
      - 'veris/skills/veris-reference/scripts/**'
      - 'tests/**'
      - '.github/workflows/test-skill-helpers.yml'
  push:
    branches: [main]
    paths:
      - 'veris/skills/veris-reference/scripts/**'
      - 'tests/**'
      - '.github/workflows/test-skill-helpers.yml'
jobs:
  handoff:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.8', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -B -m unittest discover -s tests -v
