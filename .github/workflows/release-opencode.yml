# Publishes the tested tarball from canonical veris/skills as
# @veris-ai/veris-opencode. Complete the new package's initial publication and
# trusted-publisher setup for veris-ai/plugins and this workflow before dispatching.
name: release-opencode

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (default: veris/.claude-plugin/plugin.json)"
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veris/.opencode-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No registry-url/token .npmrc: npm trusted publishing uses OIDC.
      - run: npm install -g npm@latest
      - run: npm ci

      - name: Resolve version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$REQUESTED_VERSION"
          [ -n "$VERSION" ] || VERSION="$(jq -r .version ../.claude-plugin/plugin.json)"
          npm pkg set version="$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          test "$(node -p 'require("./package.json").name')" = '@veris-ai/veris-opencode'

      - name: Refuse a version npm already has
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@veris-ai/veris-opencode@$VERSION" version >/dev/null 2>&1; then
            echo "@veris-ai/veris-opencode@$VERSION is already on npm." >&2
            echo "Bump the version in the source manifests first." >&2
            exit 1
          fi

      - name: Pack canonical skills
        id: pack
        run: |
          npm pack --json > packed.json
          TARBALL="$(jq -r '.[0].filename' packed.json)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          tar -tzf "$TARBALL"

      - name: Test repository and exact release tarball
        working-directory: .
        env:
          VERIS_TEST_TARBALL: ${{ github.workspace }}/veris/.opencode-plugin/${{ steps.pack.outputs.tarball }}
        run: |
          sh tests/ledger_repository.sh
          sh tests/record_argv.sh
          sh tests/opencode_plugin.sh

      - name: Publish the packed artifact
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --access public

      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="opencode-v$VERSION"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "@veris-ai/veris-opencode $VERSION" \
            --notes "https://www.npmjs.com/package/@veris-ai/veris-opencode/v/$VERSION"
