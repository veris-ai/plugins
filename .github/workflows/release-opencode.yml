# Publishes veris-sim/.opencode-plugin to npm as @veris-ai/veris-sim-opencode.
#
# Run manually from the Actions tab. The version comes from
# .claude-plugin/plugin.json -- the single place versions are bumped -- so the
# release flow is: bump the version in a PR, merge, run this. The input exists
# only to override that in an emergency.
#
# Auth is npm trusted publishing (OIDC): configure once on npmjs.com under the
# package's Settings -> Trusted Publisher (repo veris-ai/plugins, workflow
# release-opencode.yml). No token, no secret; npm's 2FA rules don't apply to
# OIDC and provenance comes for free. A package npm has never seen has no
# settings page, so @veris-ai/veris-sim-opencode's first version goes out from
# a laptop (npm publish; the manifest's publishConfig makes it public).
# Configure the trusted publisher after that, and every later version comes
# from here.
#
# The 0.7.0 cutover off opencode-veris-sim, run once from a laptop logged into
# npm. Both publishes are manual: the new name has no settings page yet, and
# this workflow's OIDC identity is bound to whatever name the manifest carries,
# so it can no longer publish the old one.
#
#   cd veris-sim/.opencode-plugin
#   npm publish                                   # @veris-ai/veris-sim-opencode
#   npm pkg set name=opencode-veris-sim           # the retired name, one last time
#   npm publish                                   # same working plugin, says where it moved
#   git checkout package.json                     # put the real manifest back
#   npm deprecate 'opencode-veris-sim@*' 'moved to @veris-ai/veris-sim-opencode'
#
# The retired name keeps working -- index.js reads the manifest it was published
# under and prefixes every command description with [moved to ...]. Nothing
# breaks; an engineer on it is told.
name: release-opencode

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (default: the version in .claude-plugin/plugin.json)"
        required: false

permissions:
  contents: write # tag + GitHub release
  id-token: write # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veris-sim/.opencode-plugin
    steps:
      - uses: actions/checkout@v4

      # No registry-url: it makes setup-node write an .npmrc pinning token auth
      # to a placeholder NODE_AUTH_TOKEN, and npm then never reaches for OIDC.
      # That is what failed run 33198510143 — a token-authed PUT, no provenance
      # line in the log, and npm's 404-for-bad-auth. The default registry is
      # npmjs.org anyway, which is where this publishes.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      # The suite runs from the repository root, not the package directory,
      # and before "Resolve version" so an emergency override of the version
      # cannot make the four-manifest check disagree with itself.
      - name: Stage 1
        working-directory: ${{ github.workspace }}
        run: bash tests/run.sh

      - name: Resolve version
        id: version
        run: |
          VERSION='${{ inputs.version }}'
          [ -n "$VERSION" ] || VERSION="$(jq -r .version ../.claude-plugin/plugin.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          npm pkg set version="$VERSION"
          echo "Publishing @veris-ai/veris-sim-opencode@$VERSION"

      - name: Refuse a version npm already has
        run: |
          if npm view "@veris-ai/veris-sim-opencode@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "@veris-ai/veris-sim-opencode@${{ steps.version.outputs.version }} is already on npm." >&2
            echo "Bump the version in .claude-plugin/plugin.json (and its siblings) first." >&2
            exit 1
          fi

      # prepack copies ../skills into the tarball; prove every file landed
      # before publish. A reference/*.md the tarball lacks is a link the
      # installed plugin cannot open, and a scripts/*.sh it lacks is a
      # .veris/bin/ the npm staging route cannot fill.
      - name: Pack and inspect
        run: |
          npm pack
          TGZ="veris-ai-veris-sim-opencode-${{ steps.version.outputs.version }}.tgz"
          LIST="$(tar -tzf "$TGZ")"
          missing=''
          for f in $(cd .. && find skills \( -name '*.md' -o -name '*.sh' -o -name '*.yaml' \) | sort); do
            printf '%s\n' "$LIST" | grep -qxF "package/$f" || missing="$missing $f"
          done
          [ -z "$missing" ] || { echo "missing from tarball:$missing" >&2; exit 1; }
          printf '%s\n' "$LIST"

      - name: Publish
        run: npm publish

      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="opencode-v${{ steps.version.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "@veris-ai/veris-sim-opencode ${{ steps.version.outputs.version }}" \
            --notes "https://www.npmjs.com/package/@veris-ai/veris-sim-opencode/v/${{ steps.version.outputs.version }}"
