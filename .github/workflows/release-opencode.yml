# Publishes veris/.opencode-plugin to npm as opencode-veris.
#
# Run manually from the Actions tab. The version comes from
# .claude-plugin/plugin.json -- the single place versions are bumped -- so the
# release flow is: bump the version in a PR, merge, run this. The input exists
# only to override that in an emergency.
#
# Auth is npm trusted publishing (OIDC): configure once on npmjs.com under the
# package's Settings -> Trusted Publisher (repo veris-ai/plugins, workflow
# release-opencode.yml). No token, no secret; npm's 2FA rules don't apply to
# OIDC and provenance comes for free.
name: release-opencode

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (default: the version in .claude-plugin/plugin.json)"
        required: false

permissions:
  contents: write # tag + GitHub release
  id-token: write # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veris/.opencode-plugin
    steps:
      - uses: actions/checkout@v4

      # No registry-url: it makes setup-node write an .npmrc pinning token auth
      # to a placeholder NODE_AUTH_TOKEN, and npm then never reaches for OIDC.
      # That is what failed run 33198510143 — a token-authed PUT, no provenance
      # line in the log, and npm's 404-for-bad-auth. The default registry is
      # npmjs.org anyway, which is where this publishes.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - name: Resolve version
        id: version
        run: |
          VERSION='${{ inputs.version }}'
          [ -n "$VERSION" ] || VERSION="$(jq -r .version ../.claude-plugin/plugin.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          npm pkg set version="$VERSION"
          echo "Publishing opencode-veris@$VERSION"

      - name: Refuse a version npm already has
        run: |
          if npm view "opencode-veris@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "opencode-veris@${{ steps.version.outputs.version }} is already on npm." >&2
            echo "Bump the version in .claude-plugin/plugin.json (and its siblings) first." >&2
            exit 1
          fi

      # prepack copies ../skills into the tarball; prove it landed before publish.
      - name: Pack and inspect
        run: |
          npm pack
          tar -tzf "opencode-veris-${{ steps.version.outputs.version }}.tgz" | grep -q "package/skills/setup/SKILL.md" \
            || { echo "skills/ missing from tarball" >&2; exit 1; }
          tar -tzf "opencode-veris-${{ steps.version.outputs.version }}.tgz"

      - name: Publish
        run: npm publish

      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="opencode-v${{ steps.version.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "opencode-veris ${{ steps.version.outputs.version }}" \
            --notes "https://www.npmjs.com/package/opencode-veris/v/${{ steps.version.outputs.version }}"
