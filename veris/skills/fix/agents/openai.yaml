interface:
  display_name: "Veris fix"
  short_description: "Fix a defect: reproduce the failure against the twin first, prove it closed with current-run twin evidence."
  default_prompt: "$fix <issue link or prompt>"
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "cli"
      value: "veris"
      description: "For CLI-owned execution: the veris CLI on PATH, signed in; the repository wired by $setup (.veris/twin.yaml present)."
