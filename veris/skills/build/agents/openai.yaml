interface:
  display_name: "Veris build"
  short_description: "Build a feature: measure the vendor's twin before designing, prove the change with a receipt from veris run."
  default_prompt: "$build <issue link or prompt>"
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "cli"
      value: "veris"
      description: "The veris CLI on PATH, signed in; the repository wired by $setup (.veris/twin.yaml present)."
