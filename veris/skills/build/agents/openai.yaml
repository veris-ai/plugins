interface:
  display_name: "Veris build"
  short_description: "Build and test a feature using Veris twins."
  default_prompt: "$build <issue link or prompt>"
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "cli"
      value: "veris"
      description: "For CLI-owned execution: the veris CLI on PATH, signed in; the repository wired by $setup (.veris/twin.yaml present)."
